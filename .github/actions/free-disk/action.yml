# The runner's free disk is too small for the Docker images, the emulator build
# and every test's carts. This deletes toolchains we never use (dotnet, Android,
# ghc, CodeQL) in the background: the job goes on at once and the space is
# free long before the first build needs it.
name: Free disk space
description: Delete unused preinstalled toolchains in the background
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &
