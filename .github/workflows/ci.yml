# Checks every push to main and every pull request: lint, build the kernel
# (kept as a download), and run the homebrew tests on the emulated cart. Each
# job runs the same `just` recipe as on a developer's machine. Games you own
# (`just compat`) stay local: their ROMs are never in the repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v6
      - name: Lint Python and shell scripts
        run: just lint

  kernel:
    name: Build kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Build ezkernelnew.bin
        run: just build
      - name: Check size against the cart and GBA memory
        run: just size
      - name: Upload ezkernelnew.bin
        uses: actions/upload-artifact@v4
        with:
          name: ezkernelnew
          path: dist/ezkernelnew.bin
          if-no-files-found: error

  test:
    name: Test on the emulated cart
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Run kernel unit tests and homebrew game tests
        run: just test
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: dist/shots
          if-no-files-found: ignore
