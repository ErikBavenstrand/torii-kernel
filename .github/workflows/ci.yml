# Checks every push to main and every pull request: lint, build the kernel
# (kept as a download), run the host tests and the homebrew tests on the
# emulated cart, and run the advisory static analysis. Each
# job runs the same `just` recipe as on a developer's machine. The images
# and the emulator build are cached (.github/actions/image and the test job);
# tools/fresh.py's records come with them, so `just` rebuilds whatever doesn't
# match its inputs, as it does locally. Actions are
# pinned to commits, and just and uv to versions. Games you own
# (`just compat`) stay local: their ROMs are never in the repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.23
          # The lint tools are pinned in the justfile; there is no lock file.
          cache-dependency-glob: justfile
      - name: Lint C, Python, shell scripts and workflows
        run: just lint

  kernel:
    name: Build kernel
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - name: Build ezkernelnew.bin
        run: just build
      - name: Check size against the cart and GBA memory
        run: just size
      # Rebuilds from a shuffled copy of the source in another folder
      - name: Check the build is reproducible
        run: just repro
      - name: Upload ezkernelnew.bin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ezkernelnew
          path: dist/ezkernelnew.bin
          if-no-files-found: error

  test:
    name: Test on the emulated cart
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - uses: ./.github/actions/image
        with:
          image: torii-emu
          dockerfile: docker/emu.Dockerfile
          record: emu-image
          recipe: emu-image
      # The emulator build is cached under the hash tools/fresh.py checks it
      # against: of what `just emu-headless` reads (emu_inputs in the
      # justfile), so mGBA must be fetched first.
      - name: Fetch mGBA
        id: emu-inputs
        run: |
          emu/fetch.sh
          # shellcheck disable=SC2046 # emu_inputs is a list of paths
          echo "hash=$(python3 tools/fresh.py hash $(just --evaluate emu_inputs))" >> "$GITHUB_OUTPUT"
      - id: emu
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            emu/build-linux
            dist/.fresh/emu-headless
          key: emu-build-${{ runner.arch }}-${{ steps.emu-inputs.outputs.hash }}
      - name: Build the emulator
        run: just emu-headless
      - if: steps.emu.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            emu/build-linux
            dist/.fresh/emu-headless
          key: ${{ steps.emu.outputs.cache-primary-key }}
      - name: Lower mmap randomisation, which this ASan can't handle at 32 bits
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Run kernel unit tests and homebrew game tests
        run: just test
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: dist/shots
          if-no-files-found: ignore

  analyze:
    name: Static analysis (advisory)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Advisory: the job fails only on findings missing from
    # tools/analyze-baseline.txt, and that doesn't fail the workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.23
          cache-dependency-glob: justfile
      - uses: ./.github/actions/image
        with:
          image: torii-analyze
          dockerfile: docker/analyze.Dockerfile
          record: analyze-image
          recipe: _analyze-image
      - name: Run cppcheck, clang-tidy and GCC's -fanalyzer against the baseline
        run: just analyze
