# Publishes a GitHub Release when a version tag (v0.1.0, ...) is pushed: the
# kernel is built, checked to be reproducible and tested, then ezkernelnew.bin
# is attached with install steps and the newest CHANGELOG.md section as notes
# (tools/release_notes.sh), and with ezkernelnew.sym and ezkernelnew.elf, which
# `just logs --tag` and gdb read for crash dumps from this build.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - name: Lower mmap randomisation, which this ASan can't handle at 32 bits
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Run all tests (builds ezkernelnew.bin)
        run: just test
      - name: Check size against the cart and GBA memory
        run: just size
      - name: Check the build is reproducible
        run: just repro
      - name: Upload the kernel and its symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ezkernelnew
          path: |
            dist/ezkernelnew.bin
            dist/ezkernelnew.sym
            ezkernelnew.elf
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ezkernelnew
      - name: Write release notes
        run: tools/release_notes.sh > release-notes.md
      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/ezkernelnew.bin
            dist/ezkernelnew.sym
            ezkernelnew.elf
          body_path: release-notes.md
