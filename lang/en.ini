# Torii's English: the source of truth for every string the menu shows.
#
# The kernel reads a string as S(STR_SECTION_KEY) (source/lang.h); `just lang`
# turns this file into source/lang_ids.h and source/lang_en.c. A translation,
# lang/<code>.ini, has the same keys (any it leaves out show in English).
# tools/lang.py's top explains the format: {1} to {9} are what the code
# fills in, .one and .other a count's forms, \n a line break and \t a tab.
#
# Widths: the hint bar takes about 38 characters, a popup's row about 20, a
# confirmation's line about 30, a dialog 4 lines. A translation that runs
# longer is cut with "...", so keep to English's length where you can.

[meta]
code = en
name = English
# The sections a launch reads after the game fills PSRAM: they come first
launch = format month hint launch error state ingame

# --- What a launch shows ---------------------------------------------------

# Numbers and dates. decimal: the separator in "1.5 MB"; thousands: in
# "1,204 files" (empty for none); date: a day and a month's name ("28 Oct");
# date_numeric: a day and a month as two digits each ("10-28"); percent: a
# progress bar's share done, beside the bar
[format]
decimal = .
thousands = ,
date = {day} {month}
date_numeric = {month}-{day}
percent = {1}%

# The months' short names, in dates
[month]
jan = Jan
feb = Feb
mar = Mar
apr = Apr
may = May
jun = Jun
jul = Jul
aug = Aug
sep = Sep
oct = Oct
nov = Nov
dec = Dec

# The hint bar's labels, after a key chip ("A open")
[hint]
open = open
turn = turn
move = move
back = back
ok = OK
cancel = cancel
change = change
done = done
field = field
set = set
menu = menu
format = format

[launch]
loading_game = Loading the game
patching = Patching the game
writing = Writing to NOR
nor_full = Not enough room in NOR
file_overflow = Too big to start from the SD card (over 32 MB). Write it to NOR instead.
done = Done
# The question before a launch while a save waits to be copied: {1} the
# save's file
save_mismatch = The save in the cart doesn't look like {1}. Write it over that file anyway?
# {1} the save's file, {2} its old size in bytes
save_type_changed = The save type of {1} changed. Its old save ({2} bytes) is kept in History, and the game starts with a new one.
save_unsaved = The save of {1} isn't on the card yet. Launching loses it. Launch anyway?

# Why a game didn't start, or a save couldn't be copied
[error]
folder = Can't open the folder
file = Can't open the file
save_folder = Can't make the save folder
save_write = Can't write the save
save_read = Can't read the save
save_create = Can't create the save file
state_create = Can't create the save state file
fragmented = The file is too fragmented. Copy it to the card again.
save_path = The save's path is too long. Move the game to a shorter folder.
folder_path = The folder path is too long
rts_space = Torii needs 448 KB free in one piece on the card for in-game states (/torii/rts.bin). Free some space.

# Save states: a slot's row in the in-game menu and the game's menu ({1} the
# slot's number; {2} the date, {3} the time); the slot alone
[state]
row_when = Slot {1} · {2} {3}
row_saved = Slot {1} · saved
row_empty = Slot {1} · empty
row_unkept = Slot {1} · not kept yet
slot = Slot {1}
# The game's popup's Load state: the date and time
when = {1} {2}
keeping = Saving the save state
none = No save states yet.\nSave one from the in-game menu.
not_kept = The save state wasn't kept:\nthe card didn't take it.
# A launch into a slot that doesn't read: the question's title and text
unreadable = This state can't be read
other_game = This state is another game's
newer = This state needs a newer Torii
start_anyway = A starts the game anyway,\nfrom its start. B goes back.
# Filing the in-game screenshots at boot: the progress dialog (several,
# one: its text the game), {1} of {2} its status, and its failure
shot_saving = Saving screenshots
shot_saving_one = Saving the screenshot
shot_of = {1} of {2}
shot_failed = The screenshot wasn't saved:\nthe card didn't take it.

# The in-game menu (drawn by the kernel at launch): 32 characters a line
[ingame]
resume = Resume
save = Save state
load = Load state
cheats_on = Cheats: on
cheats_off = Cheats: off
reset = Reset game
sleep = Sleep
torii = Back to Torii
debug = Debug snapshot
# Under the rows after a DEBUG snapshot
debug_saved = Snapshot kept for the log
# The cheat list: its row and title, its two rows for all, its footer, and
# why a cheat can't change
cheats = Cheats
all_off = All off
as_launched = Back to my picks
kept = Back to Torii keeps these picks
why_rom = Patches the ROM: pick it in Torii
why_locked = On until Back to Torii
why_cant = Torii can't run this code
why_room = No room in game: pick it in Torii
why_slow = Too slow with the cheats on now
# The state slots' footers
state_keep = Kept on Back to Torii
state_replaces = Replaces the state not kept yet
state_load = A goes back to this point
state_elsewhere = Load it from the game in Torii
state_empty = Nothing saved in this slot
shot = Screenshot
shot_saved = Saved: kept on Back to Torii
# The menu's footer: {1} its keys ("L+R+START"); short leaves out "A: choose"
# where the whole doesn't fit
hint = A: choose, {1} or B: resume
hint_short = {1} or B: resume
sleep_wakes = START+SELECT wakes it
shot_full = Full: go back to Torii to keep them
state_saved = Kept on Back to Torii; lost if off
# Back to Torii files what waits in cart memory: its row then, and the Save
# state and Screenshot rows' footer at the session's first opening
torii_save = Back to Torii and save
first_save = Saved to the card on Back to Torii
unsaved_state = Not on card yet: 1 state
# The Screenshot row once some are taken: {1} of {2}
shot_count = Screenshot {1}/{2}
# The footer while {1} screenshots wait, alone or with a state
unsaved_shots.one = Not on card yet: {1} screenshot
unsaved_shots.other = Not on card yet: {1} screenshots
unsaved_both.one = Not on card yet: 1 state, {1} shot
unsaved_both.other = Not on card yet: 1 state, {1} shots
# The game's title when it has none
untitled = Torii
# The boot's dialog after the in-game menu couldn't open: {1} the game, {2} why
refused_title = In-game menu didn't open
refused = {1}: {2}. Save states and cheats need it; the game's saves are safe.
# {1}: Flash or EEPROM
refused_save = cart memory is unavailable with its {1} save
refused_memory = cart memory was unavailable
refused_image = its copy in cart memory was damaged
refused_game = the game

