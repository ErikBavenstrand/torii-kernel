# Hotkeys
They work in GBA games started with addons: as Settings, Games, GBA boot mode says, as the game's Boot mode in its Game info does, or as Play in its menu picks. Settings, Hotkeys sets them. A game on the NOR keeps the hotkeys it was written with.

"""
