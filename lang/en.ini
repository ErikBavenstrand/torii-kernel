controls_text = """
# Home
«»\tturn the carousel
A\topen the item
# Every page
^v\tmove
B\tback, towards the carousel
# Game lists
«»\tthe next or previous letter (A-Z lists)
A\tplay the game
START\tthe game's menu: Play, Saves, Cheats, Load state, Favourite, Rename, Game info, Delete
In its Game info, ^v picks a GBA game's save type or boot mode, and «» changes it.
# Starting a game
A\tGBA games start as Settings' GBA boot mode says, or as their Game info's Boot mode does
«»\ton Play in the game's menu: Default, With addons or Clean
L\thold it as you press A, or as you pick Play: the game starts with the GBA's boot screen.
SELECT\thold it as you press A to pick the save slot (a game with two or more asks every time)
# SD card
A\topen the folder, or start the game
START\tthe file's menu: Play, Write to NOR, Saves, Favourite, Rename, File info, Delete
«»\tpage up, page down
B\tup a folder; at the top, back to the carousel
# NOR
A\tstart the game
START\tthe game's menu
# Settings
L R\tthe previous or next section
A\tchange the value: «» picks, A keeps it, B puts it back
Time and date: A, then «» picks a field and ^v changes it.
Hotkeys: A, then hold the new keys together.
# Rename
In a game's menu, Rename gives the game a name of your own in its lists, in place of its file's or No-Intro's: a romhack's too. On the SD card page it renames the file.
^v «»\tpick a key
A\ttype it
B\tdelete a letter
L R\tmove along the name
SELECT\tcapitals
START\tkeep the name; the Cancel key leaves it as it was
# Menus
^v\tchoose
A\tpick
B\tclose
In a question, «» chooses and B cancels.
# At power-on
Home faces the item you were last on, or the one Settings' Start on picks.
Hold L, R and SELECT as you switch on to run Diagnostics, even when the menu won't start.
"""
saves_text = """
# Where saves go
A game saves to the cart. The next time Torii starts, it copies the save to /torii/saves on the card: it asks first, unless Settings, Saves, Save without asking is on. Start another game before that and Torii warns you that the save would be lost.
# Slots
A game can keep up to 16 saves, its slots; the first is Main. Saves in its menu lists them:
A\tplay the slot; it becomes the active one, the one Play uses
START\tPlay, Make active, Backups, Rename, Copy to new slot, Delete
»\tits backups
+ New slot starts one empty, as a copy of the active one, or from a .sav file (GBA games). A game with two or more slots asks which to play each time it starts.
# Backups
When a save is copied to the card, the one before it is kept as a backup: as many as Settings, Saves, Backups kept says. A on a backup restores it, and the save it replaces is kept too. When a game's save type changes, its old save is kept for good.
# Deleted saves
A deleted slot waits in /torii/trash for 30 days. Settings, Saves, Clean up saves finds saves whose game is gone (move them to a game or delete them) and empties the trash; Game saves lists every game with saves.
# Save states
Settings, Games, Save states turns them on for GBA games. Save state in the in-game menu keeps the game as it is, and Back to Torii writes it to /torii/states: 8 states for each save slot. Load state in a game's menu lists them, newest first, and starts the game in the one you pick.
A state stays in the cart until Back to Torii: switch off before that and it is lost (the game's own save isn't).
# GB, GBC and NES games
Their slots hold the emulator's memory: the game's save, its settings and its own save states.
"""
cheats_text = """
# Cheat files
A GBA game's cheats are in /torii/cheats, in a file named as the game, in libretro's .cht format. Torii's cheats tool writes them on a PC from GameHacking.org, or you can add your own. Cheats in a game's menu lists them.
# The list
A\tpick or drop a cheat; one with blanks opens the keypad to fill them in
START\tDetails, Edit code, Delete, Turn all off, Show picked only
SELECT\tedit or delete a code you typed
«»\tpage up, page down
+ Add code types a new code and names it. A greyed cheat says why it can't run.
# The keypad
^v «»\tmove over the keys
A\ttype the key
B\tdelete a digit; L and B clear the code
L R\tthe previous or next line
SELECT\tthe code's format
START\tsave it
It takes GameShark, Action Replay and CodeBreaker codes, and VBA's address:value.
# When they run
Picked cheats run from the game's first frame when it starts with addons; a clean start runs none. Cheats that patch the ROM don't run in NOR games.
In game, Cheats in the in-game menu turns them on and off, and Back to Torii keeps what you changed as the game's picks.
"""
help_text = """
# The in-game menu doesn't open
It opens only in GBA games started with addons, and as Settings, Hotkeys, In-game menu says: Auto opens it only with save states on or cheats picked. A game on the NOR keeps the hotkeys it was written with. If the menu couldn't go in, Torii says why at the next start.
# A save isn't on the card
Torii copies it the next time it starts, after you play. B to Save to SD card? leaves it in the cart only, and a card that refused it is tried again at the next start.
# A save state or screenshot is gone
They stay in the cart until Back to Torii: switching off first loses them. The game's own save is safe.
# Cheats do nothing
They run only when the game starts with addons: see Settings, Games, GBA boot mode, and the game's Boot mode in its Game info.
# A game won't start
A file in too many pieces: copy it to the card again. A path too long for its save: move the game to a shorter folder. A ROM over 32 MB: write it to the NOR.
# A name or cover is missing
Torii looks new games up by their CRC in /torii/names.db, and their covers in /torii/art and /torii/art.pak, on its own. Settings, Library, Identify library looks every game up again.
# Something else
Run Diagnostics below, or hold L, R and SELECT as you switch on. Settings, System, Logging writes a log to /torii/logs to send with a report.
"""
