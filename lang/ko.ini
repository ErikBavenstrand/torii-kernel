ingame_end = """
# 스테이트와 스크린샷
스테이트 저장과 스크린샷(최대 5장)은 카트에 담기고, Torii로 돌아가기가 카드에 써요. 스크린샷은 /torii/screenshots에 BMP 파일로 저장돼요. 그 전에 끄면 잃어요. 스테이트 불러오기는 아직 쓰지 않은 스테이트를 불러오고, 나머지는 Torii의 게임 메뉴에서 불러와요.
# 치트
치트는 게임에서 고른 치트를 켜고 꺼요. Torii로 돌아가기가 바꾼 내용을 저장해요.
# 치트 검색
생명 수 같은 게임의 값을 찾아 치트로 만들어요. 검색 시작은 게임 메모리를 기억해요. 값이 바뀔 때까지 플레이하고 어떻게 바뀌었는지 고르세요 (줄어듦, 25 늘어남, 3과 같음, ...). 몇 개 남을 때까지 반복해서 보기, 하나 고르기, 값 정하기, 유지를 하면 지금 켜지고, Torii로 돌아가기 뒤에 게임의 치트에 "Found"로 들어가요. 음수, BCD 점수, 첫 스캔, 움직이는 값의 포인터도 쓸 수 있어요. 스테이트 메모리를 쓰므로 아직 카드에 없는 스테이트가 먼저 거기로 가요.
# 세이브
게임은 카트에 저장해요. 다음에 Torii가 시작되면 카드로 복사해요 (묻지 않고 저장이 켜져 있지 않으면 먼저 물어봐요).
# GB, GBC, NES 게임
내장된 Jagoomba Color(GB, GBC)와 PocketNES(NES)에서 실행돼요. L과 R을 함께 누르면 에뮬레이터 자체 메뉴가 열려요: 스테이트, 팔레트 등. Torii의 단축키, 메뉴, 치트는 GBA 게임용이에요.

