# Torii in Korean (한국어). Drafted by Claude from lang/en.ini. NOT REVIEWED BY A
# NATIVE SPEAKER: [meta]'s `review = pending` keeps this pack out of the
# release's torii-lang.zip (tools/lang.py); `just build` still makes
# dist/lang/ko.lng for a card. Once a native speaker has read it, change that
# line to `review = done` and the next release's zip carries it.
#
# Same keys as lang/en.ini (its top explains the widths); tools/lang.py's top
# explains the format. Register: polite 해요체 (-요) in sentences, nouns for
# labels and hints. No particle follows a {1}-{9} that holds a name (a file's,
# a cheat's): "{1} 삭제할까요?", since the right particle depends on the name's
# last sound.
#
# Korean is dense: Galmuri's Hangul glyphs are 10 px wide against about 5.5
# for a Latin letter, and a hint bar, a popup's row and a settings row hold
# the pixels of the English text, so these texts are shorter than English's
# in characters (the 38-character limit is about 23 Hangul).
#
# What stays English on purpose: a game launch fills PSRAM and drops the
# script font (script_drop), so a string the launch or the in-game menu shows
# would draw as replacement boxes. The sections [launch], [error], [state],
# [ingame], [activation], [button] and [button.short], and hint.ok and
# hint.cancel (a launch's questions use them), are left out, and English
# shows. The dates are numbers for the same reason ("10.28": [month], [format]).
# Log lines and Diagnostics' title stay English as everywhere.
#
# One term each, throughout:
#   save          세이브 (a game's save); 저장 (the verb)
#   save state    스테이트 (스테이트 저장, 스테이트 불러오기)
#   slot          슬롯
#   backup        백업
#   cheat         치트 (a code: 치트 코드)
#   favourite     즐겨찾기
#   screenshot    스크린샷
#   in-game menu  게임 내 메뉴
#   Back to Torii Torii로 돌아가기
#   hotkeys       단축키
#   addons        애드온
#   boot mode     부팅 방식
#   play (a game) 실행
#   rename        이름 바꾸기
#   library       라이브러리
#   box art       박스 아트

