SELECT\tA를 누를 때 누르고 있으면 세이브 슬롯을 골라요 (슬롯이 둘 이상인 게임은 매번 물어요. 설정, 세이브, 슬롯 묻기를 끄면 안 물어요)
# SD 카드
A\t폴더 열기, 또는 게임 시작
