SELECT\t코드 형식
START\t저장
GameShark, Action Replay, CodeBreaker 코드와 Torii 코드를 받아요. Torii 코드는 주소:값 형식이고, 줄 앞에 주소=값 같은 조건을 붙일 수 있어요.
# 실행될 때
고른 치트는 애드온으로 시작한 게임의 첫 프레임부터 실행돼요. 클린 시작은 아무것도 실행하지 않아요. ROM을 패치하는 치트는 NOR 게임에서는 실행되지 않아요.
게임 중에는 게임 내 메뉴의 치트로 켜고 끄고, Torii로 돌아가기가 바꾼 내용을 게임의 선택으로 저장해요.
"""
help_text = """
# 게임 내 메뉴가 열리지 않아요
애드온으로 시작한 GBA 게임에서만 열리고, 설정, 단축키, 게임 내 메뉴대로 동작해요. 자동은 스테이트가 켜져 있거나 치트를 골랐을 때만 열어요. NOR의 게임은 써 넣을 때의 단축키를 유지해요. 메뉴를 넣지 못했다면 다음 시작 때 Torii가 이유를 알려줘요.
# 세이브가 카드에 없어요
Torii는 게임을 한 뒤 다음에 시작할 때 복사해요. SD 카드에 저장할까요?에서 B를 누르면 카트에만 남고, 카드가 거부했다면 다음 시작 때 다시 시도해요.
# 스테이트나 스크린샷이 사라졌어요
Torii로 돌아가기 전까지 카트에 있어요. 그 전에 끄면 잃어요. 게임 자체 세이브는 안전해요.
# 치트가 작동하지 않아요
게임이 애드온으로 시작할 때만 실행돼요. 설정, 게임, GBA 부팅 방식과 게임 정보의 부팅 방식을 보세요.
# 게임이 시작되지 않아요
조각이 너무 많은 파일: 카드에 다시 복사하세요. 세이브 경로가 너무 긴 경우: 더 짧은 폴더로 옮기세요. 32 MB가 넘는 ROM: NOR에 쓰세요.
# 이름이나 표지가 없어요
Torii는 새 게임을 CRC로 /torii/names.db에서, 표지는 /torii/art와 /torii/art.pak에서 스스로 찾아요. 설정, 라이브러리, 라이브러리 식별은 모든 게임을 다시 찾아요.
# 그 밖의 문제
아래 진단을 실행하거나 켤 때 L, R, SELECT를 누르고 있으세요. 설정, 시스템, 로그 기록은 /torii/logs에 보고서에 첨부할 로그를 써요.
"""
ingame_start = """
# 단축키
애드온으로 시작한 GBA 게임에서 동작해요: 설정, 게임, GBA 부팅 방식대로, 게임 정보의 부팅 방식대로, 또는 SD 카드 페이지 메뉴의 실행이 고른 대로예요. 설정, 단축키에서 정해요. NOR의 게임은 써 넣을 때의 단축키를 유지해요.

"""
ingame_menu = """
