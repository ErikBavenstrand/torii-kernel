saves_text = """
# 세이브가 가는 곳
게임은 카트에 저장해요. 다음에 Torii가 시작되면 세이브를 카드의 /torii/saves로 복사해요. 설정, 세이브, 묻지 않고 저장이 켜져 있지 않으면 먼저 물어봐요. 그 전에 다른 게임을 시작하면 세이브를 잃는다고 Torii가 알려줘요.
# 슬롯
게임은 슬롯이라는 세이브를 최대 16개 가질 수 있고, 첫 번째는 Main이에요. 게임 메뉴의 세이브에서 볼 수 있어요:
A\t슬롯 실행. 활성 슬롯이 되고, 실행은 이 슬롯을 써요
START\t실행, 활성으로, 백업, 이름 바꾸기, 새 슬롯으로 복사, 삭제
»\t슬롯의 백업
+ 새 슬롯은 빈 슬롯, 활성 슬롯의 복사본, 또는 .sav 파일(GBA 게임)로 시작해요. 슬롯이 둘 이상인 게임은 시작할 때마다 어느 슬롯인지 물어요. 설정, 세이브, 슬롯 묻기로 끌 수 있고, SELECT와 A는 계속 물어요.
# 백업
세이브를 카드에 복사할 때 이전 세이브는 백업으로 남아요. 개수는 설정, 세이브, 백업 보관 수가 정해요. 백업에서 A를 누르면 복원하고, 바뀐 세이브도 남아요. 게임의 세이브 종류가 바뀌면 이전 세이브는 계속 보관해요.
# 삭제한 세이브
삭제한 슬롯은 /torii/trash에서 30일 기다려요. 설정, 세이브, 세이브 정리는 게임이 사라진 세이브를 찾아 (게임으로 옮기거나 삭제) 휴지통을 비워요. 게임 세이브는 세이브가 있는 모든 게임을 보여줘요.
# 스테이트
설정, 게임, 스테이트 저장이 GBA 게임에서 스테이트를 켜요. 게임 내 메뉴의 스테이트 저장은 게임 상태를 그대로 담고, Torii로 돌아가기가 /torii/states에 써요. 세이브 슬롯마다 8개예요. 게임 메뉴의 스테이트 불러오기는 최신 순으로 보여주고 고른 스테이트로 게임을 시작해요.
스테이트는 Torii로 돌아가기 전까지 카트에 있어요. 그 전에 끄면 잃어요 (게임 자체 세이브는 괜찮아요).
# GB, GBC, NES 게임
슬롯에는 에뮬레이터의 메모리가 들어가요: 게임 세이브, 설정, 자체 스테이트.
