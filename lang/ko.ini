{1} 누르고 있으면 열려요: 계속, 스테이트 저장, 스테이트 불러오기, 치트 (또는 치트 검색), 스크린샷, 게임 리셋, 절전, Torii로 돌아가기. ^v로 이동, A로 선택, B나 같은 키로 게임을 계속해요.

"""
