controls_text = """
# Hem
«»\tsnurra karusellen
A\töppna det valda
# Alla sidor
^v\tflytta
B\ttillbaka, mot karusellen
# Spellistor
«»\tnästa eller förra bokstav (A-Z-listor)
A\tspela spelet
START\tspelets meny: Spela, Sparfiler, Fusk, Ladda snabbsparning, Favorit, Byt namn, Spelinfo, Radera
R\tgör det till favorit, eller inte (i Favoriter försvinner raden)
I dess Spelinfo väljer ^v ett GBA-spels spartyp eller startläge, och «» ändrar det.
# Starta ett spel
A\tGBA-spel startar som GBA-startläge i Inställningar säger, eller som Startläge i deras Spelinfo gör
«»\tpå Spela i spelets meny: Normal, Med tillägg eller Rent
L\thåll in den när du trycker A eller väljer Spela: spelet startar med GBA:ns startskärm.
SELECT\thåll in den när du trycker A för att välja sparplats (ett spel med två eller fler frågar varje gång)
# SD-kort
A\töppna mappen, eller starta spelet
START\tfilens meny: Spela, Skriv till NOR, Sparfiler, Favorit, Byt namn, Filinfo, Radera
«»\tsida upp, sida ner
B\tupp en mapp; högst upp, tillbaka till karusellen
# NOR
A\tstarta spelet
START\tspelets meny
# Inställningar
L R\tförra eller nästa avsnitt
A\tändra värdet: «» väljer, A behåller det, B ångrar
Tid och datum: A, sedan väljer «» ett fält och ^v ändrar det.
Snabbknappar: A, håll sedan in de nya knapparna samtidigt.
# Byt namn
I ett spels meny ger Byt namn spelet ett eget namn i listorna, i stället för filens eller No-Intros: även en romhack. På SD-kortsidan byter det namn på filen.
^v «»\tvälj en tangent
A\tskriv den
B\tradera en bokstav
L R\tflytta i namnet
SELECT\tversaler
START\tbehåll namnet; Avbryt-tangenten lämnar det som det var
# Menyer
^v\tflytta
A\tvälj
B\tstäng
I en fråga väljer «» och B avbryter.
# Vid start
Hem visar det du var på senast, eller det som Starta på i Inställningar väljer.
Håll in L, R och SELECT när du slår på för att köra Diagnostik, även när menyn inte startar.
"""
saves_text = """
# Var sparfilerna hamnar
Ett spel sparar i kassetten. Nästa gång Torii startar kopierar det sparfilen till /torii/saves på kortet: det frågar först, om inte Inställningar, Sparfiler, Spara utan att fråga är på. Startar du ett annat spel innan dess varnar Torii att sparfilen skulle gå förlorad.
# Platser
Ett spel kan ha upp till 16 sparfiler, sina platser; den första är Main. Sparfiler i dess meny listar dem:
A\tspela platsen; den blir den aktiva, den som Spela använder
START\tSpela, Gör aktiv, Backuper, Byt namn, Kopiera, Radera
»\tdess backuper
+ Ny plats startar en tom, som en kopia av den aktiva eller från en .sav-fil (GBA-spel). Ett spel med två eller fler platser frågar vilken du vill spela varje gång det startar.
# Backuper
När en sparfil kopieras till kortet behålls den förra som backup: så många som Inställningar, Sparfiler, Backuper säger. A på en backup återställer den, och sparfilen den ersätter behålls också. När ett spels spartyp ändras behålls den gamla sparfilen för gott.
# Raderade sparfiler
En raderad plats väntar i /torii/trash i 30 dagar. Inställningar, Sparfiler, Rensa sparfiler hittar sparfiler vars spel är borta (flytta dem till ett spel eller radera dem) och tömmer papperskorgen; Spelens sparfiler listar alla spel med sparfiler.
# Snabbsparningar
Inställningar, Spel, Snabbsparningar slår på dem för GBA-spel. Snabbspara i menyn i spelet behåller spelet som det är, och Till Torii skriver det till /torii/states: 8 snabbsparningar per plats. Ladda snabbsparning i ett spels meny listar dem, nyaste först, och startar spelet i den du väljer.
En snabbsparning stannar i kassetten tills Till Torii: stänger du av innan dess går den förlorad (spelets egen sparfil gör inte det).
# GB-, GBC- och NES-spel
Deras platser rymmer emulatorns minne: spelets sparfil, dess inställningar och dess egna snabbsparningar.
"""
cheats_text = """
# Fuskfiler
Ett GBA-spels fusk ligger i /torii/cheats, i en fil med spelets namn, i libretros .cht-format. Toriis fuskverktyg skriver dem på en PC från GameHacking.org, eller så lägger du till egna. Fusk i ett spels meny listar dem.
# Listan
A\tvälj eller släpp ett fusk; ett med luckor öppnar knappsatsen så att du fyller i dem
START\tDetaljer, Ändra kod, Radera, Stäng av alla, Visa bara valda
SELECT\tändra eller radera en kod du skrivit
«»\tsida upp, sida ner
+ Lägg till kod skriver en ny kod och namnger den. Ett grått fusk säger varför det inte kan köras.
# Knappsatsen
^v «»\tflytta över tangenterna
A\tskriv tangenten
B\tradera en siffra; L och B tömmer koden
L R\tförra eller nästa rad
SELECT\tkodens format
START\tspara den
Den tar koder för GameShark, Action Replay och CodeBreaker, och VBA:s adress:värde.
# När de körs
Valda fusk körs från spelets första bildruta när det startar med tillägg; en ren start kör inga. Fusk som patchar ROM:en körs inte i NOR-spel.
I spelet slår Fusk i menyn i spelet på och av dem, och Till Torii behåller det du ändrat som spelets val.
"""
help_text = """
# Menyn i spelet öppnas inte
Den öppnas bara i GBA-spel som startats med tillägg, och som Inställningar, Snabbknappar, Menyn i spelet säger: Auto öppnar den bara med snabbsparningar på eller fusk valda. Ett spel på NOR behåller snabbknapparna det skrevs med. Om menyn inte fick plats säger Torii varför vid nästa start.
# En sparfil finns inte på kortet
Torii kopierar den nästa gång det startar, efter att du spelat. B på Spara till SD-kortet? lämnar den bara i kassetten, och ett kort som inte tog emot den provas igen vid nästa start.
# En snabbsparning eller skärmbild är borta
De stannar i kassetten tills Till Torii: stänger du av innan dess förloras de. Spelets egen sparfil är säker.
# Fusken gör ingenting
De körs bara när spelet startar med tillägg: se Inställningar, Spel, GBA-startläge, och spelets Startläge i dess Spelinfo.
# Ett spel startar inte
En fil i för många bitar: kopiera den till kortet igen. En sökväg för lång för sparfilen: flytta spelet till en kortare mapp. En ROM över 32 MB: skriv den till NOR.
# Ett namn eller omslag saknas
Torii slår upp nya spel efter deras CRC i /torii/names.db, och deras omslag i /torii/art och /torii/art.pak, av sig självt. Inställningar, Bibliotek, Identifiera bibliotek slår upp alla spel igen.
# Något annat
Kör Diagnostik nedan, eller håll in L, R och SELECT när du slår på. Inställningar, System, Loggning skriver en logg till /torii/logs att skicka med en rapport.
"""
