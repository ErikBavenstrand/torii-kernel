# Torii på svenska. Drafted by Claude from lang/en.ini, checked by the owner.
#
# Same keys as lang/en.ini (its top explains the widths); tools/lang.py's top
# explains the format. One term each, throughout:
#   save          sparfil (a game's save); spara (the verb)
#   save state    snabbsparning
#   slot          plats
#   backup        backup (backuper, backupen)
#   cheat         fusk (a code: fuskkod)
#   favourite     favorit
#   screenshot    skärmbild
#   in-game menu  menyn i spelet; the game's menu in Torii: spelets meny
#   Back to Torii Till Torii
#   hotkeys       snabbknappar
#   addons        tillägg

[meta]
code = sv
name = Svenska

