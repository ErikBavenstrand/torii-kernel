# Games the compatibility test runs. The ROMs themselves are git-ignored: put
# your own copies in roms/ with `just game-add game.gba`, which also adds the
# entry here. Games whose file is missing are skipped.
#
# file   name of the ROM in roms/
# sha1   SHA-1 of the ROM, so a different dump is not mistaken for this one
# code   game code from the ROM header
# save   save chip the game needs: none, sram32k, eeprom512, eeprom8k,
#        flash64k or flash128k
# rtc    true if the game uses the cart's clock
#
# An optional starting save, roms/<file name without .gba>.sav, lets the test
# continue a game instead of starting a new one.

[[game]]
file = "Pokemon - Emerald Version (USA, Europe).gba"
title = "POKEMON EMER"
code = "BPEE"
sha1 = "f3ae088181bf583e55daf962a92bb46f4f1d07b7"
save = "flash128k"
rtc = true

[[game]]
file = "Pokemon - FireRed Version (USA, Europe).gba"
title = "POKEMON FIRE"
code = "BPRE"
sha1 = "41cb23d8dccc8ebd7c649cd8fbb58eeace6e2fdc"
save = "flash128k"
rtc = false
