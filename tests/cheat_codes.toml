# Codes that need the per-frame interpreter (v0.7): conditionals and button activators.
# keys: what to hold so a KEYINPUT condition is true ("" for one on the game's own state, which
# the test can't set up: it then only reports). Until the interpreter lands they are pending:
# reported, not failed, unless CHEAT_ENGINE_STRICT=1. Each also runs in plain mGBA's cheat engine.

[[code]]
game = "Metroid Fusion.gba"
format = "codebreaker"
desc = "Moon Jump"
code = "74000130 03FE+83001260 0040"
decoded = [{address = 0x03001260, width = 2, value = 0x40}]
rom_patch = false
interpreter = true
keys = "A"
condition = "keys == 0x03FE (KEYINPUT)"
source = "https://almarsguides.com/retro/walkthroughs/GBA/games/MetroidFusion/CodeBreaker/"
confidence = "medium"

