# Real cheat codes for tests/cheat_codes.sh: two or more per format the kernel decodes,
# and two ROM patches, for games in roms/ (missing games are skipped). Picked from a
# corpus of published codes (Almar's Guides pages, cross-checked against libretro's
# database); "decoded" is what the code writes, as mGBA decodes it. raw_vba codes are
# derived from a published code of the same cheat (VBA raw has no published lists).
# ROM patches write whatever the ROM held: the test reads the patch back, it does not
# check the game behaves (their addresses are the USA games'; roms/ holds some European).

[[code]]
game = "Metroid Fusion.gba"
format = "codebreaker"
desc = "Invulnerability"
code = "33001249 0001"
decoded = [{address = 0x03001249, width = 1, value = 0x1}]
rom_patch = false
source = "https://almarsguides.com/retro/walkthroughs/GBA/games/MetroidFusion/CodeBreaker/"
confidence = "high"

