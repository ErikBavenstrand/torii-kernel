; A test theme (tests/shots/sd-theme-reclaim.opts): the dark theme with the
; largest wallpaper there is, 128x128 px (256 tiles; rings of two colours,
; made with `just theme-wallpaper`). With its map it takes 320 of the 512
; BG VRAM units only character block 0 reaches, so a dialog that needs more
; of them for its text reclaims it, and it comes back when the dialog closes.
version = 1
name = Big wallpaper
base = dark

[wallpaper]
file = wallpaper.tas
