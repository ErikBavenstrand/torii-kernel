; A test theme (tests/shots/sd-theme-wall.opts): the dark theme with a
; 128x64 px wallpaper (128 tiles; rings of two colours, made with
; `just theme-wallpaper`). With its map it takes 192 of the 512 BG VRAM
; units only character block 0 reaches: room the SD list leaves it, but a
; question's text needs, so the wallpaper moves among the maps while the
; question is up, and back when it closes.
version = 1
name = Wall 128
base = dark

[wallpaper]
file = wallpaper.tas
