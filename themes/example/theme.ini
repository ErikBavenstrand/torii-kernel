; Torii example theme. Copy this folder to /torii/themes/example on the SD card
; and pick "example" in SETTINGS > THEME. Every key but version is optional:
; what a theme leaves out comes from its base theme.
;
; wallpaper.tas is wallpaper.png converted with
;   uv run tools/asset.py encode wallpaper.png wallpaper.tas --bpp 4
version = 1
name = Example
base = dark

[colours]
; #RRGGBB, rounded down to the GBA's 15 bits
bg = #181428
panel = #282040
text = #F0E8F8
dim = #9890B0
accent = #E8A048
accent_text = #181428
border = #484068
track = #383058
shadow = #100C1C
selection = #E8A048
selection_text = #181428

[fonts]
; body or heading, the built-in fonts
body = body
heading = heading

[layout]
row_h = 16
pad = 6

[effects]
modal_dim = 8
idle_dim = 11
fade_frames = 10
slide = 32
marquee_delay = 45
marquee_speed = 40
marquee_pause = 60
marquee_gap = 8
page_fade = 4

[input]
delay = 15
interval = 4
fast_after = 60
fast_interval = 2
skip_interval = 1
page_delay = 20
page_interval = 4
wrap_pause = 15

[wallpaper]
; A 4bpp asset of up to 256 tiles, repeated over the screen behind the menu
file = wallpaper.tas

[patches]
; VIEW.NODE.FIELD = VALUE: the UI demo's list gets 16 px margins, so the
; wallpaper shows beside it, and its scroll bar follows
ui-demo.4.x = 16
ui-demo.4.w = 32
ui-demo.5.x = 16
