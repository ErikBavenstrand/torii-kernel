; Torii example theme. Copy this folder to /torii/themes/example on the SD card
; and pick "example" in SETTINGS > THEME. Every key but version is optional:
; what a theme leaves out comes from its base theme.
;
; wallpaper.tas is wallpaper.png converted with
;   just theme-wallpaper themes/example/wallpaper.png themes/example/wallpaper.tas
; and `just theme-check themes/example` checks and previews the theme
; (docs/themes.md).
version = 1
name = Example
base = dark

[colours]
; #RRGGBB, rounded down to the GBA's 15 bits
bg = #181428
panel = #282040
text = #F0E8F8
dim = #9890B0
accent = #E8A048
accent_text = #181428
border = #484068
track = #383058
shadow = #100C1C
selection = #E8A048
selection_text = #181428

[fonts]
; body or heading, the built-in fonts
body = body
heading = heading

[layout]
row_h = 16
pad = 6

[effects]
modal_dim = 8
idle_dim = 11
fade_frames = 10
slide = 32
marquee_delay = 45
marquee_speed = 40
marquee_pause = 60
marquee_gap = 8
page_fade = 4
; Dialogs and menus: frames to open (fade in, then dim, while sliding up
; slide px) and to close
dialog_in = 12
dialog_out = 10
; How screens replace each other. effects adds up: 1 fade, 2 slide sideways,
; 4 slide up and down, 8 mosaic; out and in are frames, px how far a slide goes.
; tab: L and R between the lists and SETTINGS; deeper: folders, Recently
; Played, cheats; fade: the same screen redrawn; leave: to and from a launch
tab_effects = 3
tab_out = 3
tab_in = 8
tab_px = 16
deeper_effects = 5
deeper_out = 3
deeper_in = 8
deeper_px = 12
fade_effects = 1
fade_out = 3
fade_in = 6
fade_px = 0
leave_effects = 1
leave_out = 3
leave_in = 8
leave_px = 0

[input]
delay = 15
interval = 4
ramp = 54
top_speed = 30
page_delay = 20
page_interval = 6

[wallpaper]
; A 4bpp asset of up to 256 tiles, repeated over the screen behind the menu
file = wallpaper.tas

[patches]
; VIEW.NODE.FIELD = VALUE: the UI demo's list gets 16 px margins, so the
; wallpaper shows beside it, and its scroll bar follows
ui-demo.4.x = 16
ui-demo.4.w = 32
ui-demo.5.x = 16
